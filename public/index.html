<style>
  :root {
    --color-background: #111;
    --color-text-subtle: #999;
    --color-text: #ddd;
    --color-grid: color-mix(in srgb, var(--color-text) 7%, transparent);
    --color-line: color-mix(
      in srgb,
      var(--color-text) 20%,
      var(--color-background)
    );
    --color-line-hover: color-mix(
      in srgb,
      var(--color-text) 45%,
      var(--color-background)
    );
    --color-fill-hover: color-mix(
      in srgb,
      var(--color-text) 4%,
      var(--color-background)
    );
    --font-family: -apple-system, Helvetica, sans-serif;
    --font-size: 18px;
    --grid: 1.5rem;
    --space-1: 0.5rem;
    --space-2: 1rem;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --color-background: #e8e8e8;
      --color-text-subtle: #606060;
      --color-text: #111;
    }
  }

  html {
    color: var(--color-text);
    background-color: var(--color-background);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: var(--grid);
    overflow: auto;
  }

  /* Clips the grid layer to the page. The overflow on html above keeps this
     from passing up to the viewport, which would stop the page scrolling. */
  body {
    align-items: center;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    margin: 0;
    min-height: 100dvh;
    overflow: clip;
    padding: var(--grid) var(--space-2);
  }

  /* A grid cell is one line of text tall. Every height and gap below is a
     whole number of cells, and the width an even number so both columns land
     on grid lines. Cards sit edge to edge and share the grid line between
     them. */
  main {
    display: flex;
    flex-direction: column;
    gap: var(--grid);
    max-width: calc(16 * var(--grid));
    position: relative;
    /* The first width is for browsers without round(). */
    width: 100%;
    width: min(
      calc(16 * var(--grid)),
      round(down, 100%, calc(2 * var(--grid)))
    );
  }

  /* Anchored to main so a grid line always passes through its corner. */
  main::before {
    background-image:
      linear-gradient(to right, var(--color-grid) 1px, transparent 1px),
      linear-gradient(var(--color-grid) 1px, transparent 1px);
    background-size: var(--grid) var(--grid);
    content: "";
    inset: calc(-24 * var(--grid));
    mask-image: radial-gradient(36rem circle, #000 20%, transparent);
    pointer-events: none;
    position: absolute;
    z-index: -1;
  }

  /* An empty spacer one cell tall has its baseline at its bottom edge, so
     baseline-aligning the text with it puts the text's first baseline on a
     grid line whatever the font. Later lines follow one cell apart. The span
     inside keeps the title one flex item. */
  h1 {
    align-items: baseline;
    display: flex;
    font-size: 1rem;
    font-weight: 500;
    height: calc(2 * var(--grid));
    margin: 0;
  }

  h1::before {
    content: "";
    height: var(--grid);
  }

  nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  nav > :last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }

  /* The inset shadow draws the top and left edges and the offset shadow the
     bottom and right, so each edge sits on the grid line itself. */
  a {
    align-items: center;
    background: var(--color-background);
    box-shadow:
      inset 1px 1px var(--color-line),
      1px 1px var(--color-line);
    box-sizing: border-box;
    color: var(--color-text-subtle);
    display: flex;
    height: calc(2 * var(--grid));
    padding-inline: var(--grid);
    position: relative;
    text-decoration: none;
    transition:
      background 0.15s,
      box-shadow 0.15s;
  }

  a:hover {
    --color-line: var(--color-line-hover);
    background: var(--color-fill-hover);
    z-index: 1;
  }

  .projects strong {
    color: var(--color-text);
    display: block;
    font-weight: 500;
  }

  svg {
    fill: currentColor;
    flex-shrink: 0;
    height: 22px;
    margin-inline-start: auto;
    padding-inline-start: var(--space-1);
    transition: transform 0.15s;
    width: 22px;
  }

  a:hover svg {
    transform: translate(2px, -2px);
  }

  @media (max-width: 420px) {
    .projects {
      grid-template-columns: 1fr;
    }
  }

  /* The cards rise in one after another, the links after the projects. */
  h1,
  nav > * {
    animation: rise 0.5s ease-out backwards;
    animation-delay: calc((var(--offset, 0) + var(--i, 0)) * 70ms);
  }

  .links {
    --offset: 4;
  }

  nav > :nth-child(1) {
    --i: 1;
  }

  nav > :nth-child(2) {
    --i: 2;
  }

  nav > :nth-child(3) {
    --i: 3;
  }

  nav > :nth-child(4) {
    --i: 4;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(0.5rem);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
