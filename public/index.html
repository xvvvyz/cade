<style>
  :root {
    --color-background: #111;
    --color-text-subtle: #999;
    --color-text: #ddd;
    --color-grid: color-mix(in srgb, var(--color-text) 7%, transparent);
    /* The grid color made opaque, so a card edge drawn over a grid line looks
       the same as one drawn over the card instead of doubling up. */
    --color-line: color-mix(
      in srgb,
      var(--color-text) 7%,
      var(--color-background)
    );
    --color-line-hover: color-mix(
      in srgb,
      var(--color-text) 45%,
      var(--color-background)
    );
    --color-fill: transparent;
    --color-fill-hover: color-mix(
      in srgb,
      var(--color-text) 4%,
      var(--color-background)
    );
    --font-family: -apple-system, Helvetica, sans-serif;
    --font-size: 18px;
    --grid: 1.5rem;
    --space-1: 0.5rem;
    --space-2: 1rem;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --color-background: #e8e8e8;
      --color-text-subtle: #606060;
      --color-text: #111;
    }
  }

  html {
    color: var(--color-text);
    background-color: var(--color-background);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: var(--grid);
    overflow: auto;
  }

  /* Clips the grid layer to the page. The overflow on html above keeps this
     from passing up to the viewport, which would stop the page scrolling. */
  body {
    align-items: center;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    margin: 0;
    min-height: 100dvh;
    overflow: clip;
    padding: var(--grid) var(--space-2);
  }

  /* A grid cell is one line of text tall. Every height and gap below is a
     whole number of cells, and the width an even number so both columns land
     on grid lines. Cards sit edge to edge and share the grid line between
     them. The icon links share the title's row, on its last line. */
  main {
    display: grid;
    gap: var(--grid) 0;
    grid-template-columns: 1fr auto;
    max-width: calc(16 * var(--grid));
    position: relative;
    /* The first width is for browsers without round(). */
    width: 100%;
    width: min(
      calc(16 * var(--grid)),
      round(down, 100%, calc(2 * var(--grid)))
    );
  }

  /* Anchored to main so a grid line always passes through its corner. */
  main::before {
    background-image:
      linear-gradient(to right, var(--color-grid) 1px, transparent 1px),
      linear-gradient(var(--color-grid) 1px, transparent 1px);
    background-size: var(--grid) var(--grid);
    content: "";
    inset: calc(-24 * var(--grid));
    mask-image: radial-gradient(36rem circle, #000 20%, transparent);
    pointer-events: none;
    position: absolute;
    z-index: -1;
  }

  /* Each line box is one cell tall, so each line sits centered in its row. */
  h1 {
    font-size: 1rem;
    font-weight: 500;
    height: calc(2 * var(--grid));
    margin: 0;
  }

  /* The inset shadow draws the top and left edges and the offset shadow the
     bottom and right, so each edge sits on the grid line itself. Each nav sets
     its resting colors for its links to inherit, so hover always wins. */
  a {
    align-items: center;
    background: var(--color-fill);
    box-shadow:
      inset 1px 1px var(--color-line),
      1px 1px var(--color-line);
    box-sizing: border-box;
    color: var(--color-text-subtle);
    display: flex;
    position: relative;
    text-decoration: none;
    transition:
      background 0.15s,
      box-shadow 0.15s,
      color 0.15s;
  }

  a:hover {
    --color-fill: var(--color-fill-hover);
    --color-line: var(--color-line-hover);
    z-index: 1;
  }

  svg {
    fill: currentColor;
    flex-shrink: 0;
  }

  .projects {
    --color-fill: var(--color-background);
    display: grid;
    grid-column: 1 / -1;
    grid-template-columns: 1fr 1fr;
  }

  .projects > :last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }

  .projects a {
    height: calc(2 * var(--grid));
    padding-inline: var(--grid);
  }

  .projects span {
    color: var(--color-text);
    font-weight: 500;
  }

  .projects svg {
    height: 22px;
    margin-inline-start: auto;
    padding-inline-start: var(--space-1);
    transition: transform 0.15s;
    width: 22px;
  }

  .projects a:hover svg {
    transform: translate(2px, -2px);
  }

  /* Each icon fills one grid cell and the cell only gets its edges on hover. */
  .links {
    --color-line: transparent;
    align-self: end;
    display: flex;
    grid-column: 2;
    grid-row: 1;
  }

  .links a {
    height: var(--grid);
    justify-content: center;
    width: var(--grid);
  }

  .links a:hover {
    color: var(--color-text);
  }

  /* The edges sit on the cell's top and left pixels but just past its bottom
     and right, so the nudge centers the icon between them. */
  .links svg {
    height: 15px;
    margin: 1px 0 0 1px;
    width: 15px;
  }

  /* Too narrow to share a row, so the title centers, the projects stack and
     the icons go under them. Four cells is an even width, so centered they
     stay on grid lines. */
  @media (max-width: 420px) {
    main {
      grid-template-columns: 1fr;
    }

    h1 {
      text-align: center;
    }

    .projects {
      grid-template-columns: 1fr;
    }

    .links {
      grid-column: auto;
      grid-row: auto;
      justify-self: center;
    }
  }

  /* The cards rise in one after another, the links after the projects. */
  h1,
  nav > * {
    animation: rise 0.5s ease-out backwards;
    animation-delay: calc((var(--offset, 0) + var(--i, 0)) * 70ms);
  }

  .links {
    --offset: 4;
  }

  nav > :nth-child(1) {
    --i: 1;
  }

  nav > :nth-child(2) {
    --i: 2;
  }

  nav > :nth-child(3) {
    --i: 3;
  }

  nav > :nth-child(4) {
    --i: 4;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(0.5rem);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
